name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: ./web
        run: npm ci

      - name: Build UI
        working-directory: ./web
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build release binaries and checksums
        env:
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          for target in "linux amd64" "darwin amd64" "darwin arm64" "freebsd amd64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 make release VERSION=${{ env.VERSION }}
          done

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/gopit-server-*
            bin/gopit-daemon-*
            gopit-server-*.sha256
            gopit-daemon-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}