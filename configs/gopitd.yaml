# gopitd (agent) configuration
listen_addr: 0.0.0.0           # IP the WS + UDP beacon bind to
port: 1221                     # TCP WS and UDP beacon port for this agent
token: fade14c664765547f2b6d6f16546f0d6334bbe68efda0c3a  # dev-only pre-shared pairing token; production installs get one via `TOKEN=... ./install.sh agent`
uuid_path: /etc/gopitd/node.id  # file the agent reads/creates its node UUID in
stats_interval_seconds: 1      # how often system.stats is pushed to the control connection

# Firewall backend: nftfw (default) talks to the kernel directly via netlink
# and needs CAP_NET_ADMIN (install.sh ships it on the systemd unit); ufw is the
# legacy sudo-based integration. Both expose the same ufw.* methods.
firewall: nftfw

# Optional TLS: set both to serve wss instead of plaintext ws. When set, the
# agent announces tls:true and the gopit server dials wss:// automatically.
# Generated by install.sh (agent mode) when certs are missing; omit the lines
# to serve plain ws:// (cert generation failure falls back to this).
# tls_cert: /etc/gopitd/tls/cert.pem
# tls_key: /etc/gopitd/tls/key.pem

# ufw firewall integration (only used with firewall: ufw). The agent runs
# `sudo -n <binary_path>`; the gopitd user needs a scoped NOPASSWD sudoers
# entry (install.sh agent mode ships this exact set):
#   gopitd ALL=(root) NOPASSWD: /usr/sbin/ufw status*, /usr/sbin/ufw allow*,
#       /usr/sbin/ufw --force delete*, /usr/sbin/ufw --force enable, ...
ufw:
  binary_path: /usr/sbin/ufw    # absolute path of the ufw binary the agent shells out to
  allow_toggle: false           # permit enable/disable via the API; keep false unless you want it

# Optional terminal session recording: writes a ttyrec per session to
# <recording_dir>/<node_id>/<timestamp>.ttyrec (play back with `ttyplay`).
# Recordings contain everything the shell printed, including echoed input.
# terminal:
#   record: true
#   recording_dir: /var/lib/gopitd/recordings