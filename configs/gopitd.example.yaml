# gopitd (agent) configuration
listen_addr: 0.0.0.0           # IP the WS + UDP beacon bind to
port: 1221                     # TCP WS and UDP beacon port for this agent
token: change-me               # pre-shared pairing token; must match the server's pairing_token
uuid_path: /etc/gopitd/node.id  # file the agent reads/creates its node UUID in
stats_interval_seconds: 1      # how often system.stats is pushed to the control connection

# Optional TLS: set both to serve wss instead of plaintext ws. When set, the
# agent announces tls:true and the gopit server dials wss:// automatically.
# Generated by install.sh (agent mode) when certs are missing.
tls_cert: /etc/gopitd/tls/cert.pem
tls_key: /etc/gopitd/tls/key.pem

# ufw firewall integration. The agent runs `sudo -n <binary_path>`; the
# gopitd user needs a scoped NOPASSWD sudoers entry (install.sh agent mode
# ships this exact set):
#   gopitd ALL=(root) NOPASSWD: /usr/sbin/ufw status*, /usr/sbin/ufw allow*,
#       /usr/sbin/ufw delete*, /usr/sbin/ufw default*, /usr/sbin/ufw enable, /usr/sbin/ufw disable
ufw:
  binary_path: /usr/sbin/ufw    # absolute path of the ufw binary the agent shells out to
  allow_toggle: false           # permit ufw enable/disable via the API; keep false unless you want it